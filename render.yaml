services:
  - type: web
    name: instar-django
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: python -m gunicorn INSTAR.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60 --access-logfile -
    healthCheckPath: /salud/
    autoDeployTrigger: "off"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: INSTAR.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_STORAGE_REGION
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: instar-media
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false

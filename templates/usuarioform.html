<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta</title>
</head>
<body>
    <h1>Crear una cuenta</h1>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Registrarme</button>
    </form>

    <p>
        ¿Ya tienes una cuenta?
        <a href="{% url 'login' %}">Inicia sesión</a>
    </p>
</body>
</html>

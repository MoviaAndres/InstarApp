{% load static %}
<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Iniciar sesión · Instar</title><link rel="stylesheet" href="{% static 'css/estilos.css' %}?v=movil-1"></head>
<body class="pagina-login"><main class="contenedor-login"><section class="tarjeta-login">
<h1>Iniciar sesión</h1>
{% for mensaje in messages %}<p role="status">{{ mensaje }}</p>{% endfor %}
{% if error %}<p class="mensaje-error" role="alert">{{ error }}</p>{% endif %}
<form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
<div class="campo">
    <label for="username">Nombre de usuario</label>
    <input id="username" name="username" value="{{ username }}" autocomplete="username" required>
</div>
<div class="campo">
    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
</div>
<button class="boton-principal" type="submit">Ingresar</button></form>
<p class="registro">¿No tenés cuenta? <a href="{% url 'crear_cuenta' %}">Crear cuenta</a></p>
<p class="registro"><a href="{% url 'home' %}">Volver al inicio</a></p>
</section></main></body></html>
